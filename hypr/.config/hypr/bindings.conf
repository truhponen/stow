# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = firefox

bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private-window
# Added Microsoft Edge
bindd = SUPER SHIFT CTRL, B, Edge browser, exec, microsoft-edge-stable
bindd = SUPER SHIFT CTRL ALT, B, Edge browser (private), exec, microsoft-edge-stable --inprivate

bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, $terminal -e btop
bindd = SUPER SHIFT, D, Docker, exec, $terminal -e lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"

# Changed calendar to Google Calendar
bindd = SUPER SHIFT, C, Calendar, exec, uwsm app -- gio launch .local/share/applications/'Google Calendar.desktop'

# Changed email to Gmail
bindd = SUPER SHIFT, E, Email, exec, uwsm app -- gio launch .local/share/applications/Gmail.desktop

bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, X, X.com, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X.com Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Additional way to change audio output
bindld = SUPER, XF86AudioRaiseVolume, Switch audio output, exec, omarchy-cmd-audio-switch

# Using arrows to move different workspace
bindd = SUPER CTRL, H, Move to previous workspace, workspace, r-1
bindd = SUPER CTRL, L, Move to next workspace, workspace, r+1
bindd = SUPER CTRL, left, Move to previous workspace, workspace, r-1
bindd = SUPER CTRL, right, Move to next workspace, workspace, r+1

# Using arrows to move windows to different workspace
bindd = SUPER SHIFT CTRL, H, Move window to previous workspace, movetoworkspace, r-1
bindd = SUPER SHIFT CTRL, L, Move window to next workspace, movetoworkspace, r+1
bindd = SUPER SHIFT CTRL, left, Move window to previous workspace, movetoworkspace, r-1
bindd = SUPER SHIFT CTRL, right, Move window to next workspace, movetoworkspace, r+1

bindd = SUPER, Z, Clean windows to default workspaces, exec, /home/tuomo/.local/share/scripts/clean-workspaces

# Use CTRL ALT DELETE for power menu
unbind = CTRL ALT, DELETE
bindd = CTRL ALT, DELETE, Power menu, exec, omarchy-menu system

# Changed full screen bindings
unbind = SUPER, F
unbind = SUPER ALT, F
bindd = SUPER, F, Full width,  fullscreen, 1
bindd = SUPER ALT, F, Full screen, fullscreen, -1

# Additional full screen binding 
bindd = SUPER CTRL, UP, Full width, fullscreen, 1

# Unbind Apple bindings
unbind = CTRL, F1
unbind = CTRL, F2
unbind = SHIFT CTRL, F2

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER SHIFT, SPACE
# bindd = SUPER SHIFT, SPACE, Omarchy menu, exec, omarchy-menu
